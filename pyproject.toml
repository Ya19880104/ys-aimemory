[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ys-ai-memory-hub"
version = "0.2.0"
description = "Transactional project memory and explicit AI handoff prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "mcp==1.29.0", "pydantic>=2.10,<3", "cryptography>=46,<51"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["memory_hub*"]

[tool.setuptools.package-data]
memory_hub = ["client_requirements.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
