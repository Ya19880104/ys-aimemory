worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # HTTP bootstraps public documentation and a public CA only. Never redirect
    # credentials, forms or API requests from plaintext to TLS.
    server {
        listen 8080;
        server_name _;
        if ($request_method !~ ^(GET|HEAD)$) { return 404; }
        location = /help {
            proxy_pass http://app:8000;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
        location = /downloads/ys-ai-memory-ca.crt {
            proxy_pass http://app:8000;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        client_max_body_size 2m;
        location / {
            proxy_pass http://app:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
